<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>قرية المتابعين الذكية - Firebase</title>
<style>
:root{--bg:#0f172a;--fg:#f8fafc;--card:rgba(15,23,42,.95);--ac:#f59e0b;box-sizing:border-box}
body{margin:0;height:100vh;background:var(--bg);color:var(--fg);font-family:system-ui,Tahoma,sans-serif;overflow:hidden;touch-action:none}
canvas{display:block}
.card{position:fixed;background:var(--card);border-radius:14px;padding:14px;font-size:14px;z-index:5;border:1px solid #334155}
#login{inset:0;margin:auto;height:fit-content;width:min(88vw,340px);text-align:center}
input{padding:10px;width:85%;border-radius:10px;border:1px solid #64748b;font-size:16px;background:#fff;color:#111;text-align:center;direction:ltr;margin:10px 0}
button{background:var(--ac);color:#111;border:0;border-radius:10px;padding:9px 14px;font-size:14px;font-weight:700;cursor:pointer}
#err{color:#f87171;min-height:18px;font-size:13px}
#hud{top:10px;right:10px;display:none}
#bar{bottom:15px;right:10px;display:none;flex-direction:column;gap:6px}
#panel{top:12%;right:5vw;left:5vw;max-height:70vh;overflow:auto;display:none}
.row{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:8px 0;border-bottom:1px solid #334155}
.vip-badge{background:linear-gradient(135deg,#f59e0b,#ec4899);color:#fff;padding:2px 6px;border-radius:6px;font-size:11px;font-weight:bold}
</style>
</head>
<body>

<div id="login" class="card">
  <h2>🏘️ قرية المتابعين الذكية</h2>
  <div style="font-size:13px;opacity:.8">أدخل يوزرك للدخول لبيتك الخاص</div>
  <input id="u" placeholder="@username" autocomplete="off">
  <div id="err"></div>
  <button id="go">دخول القرية</button>
</div>

<div id="hud" class="card"></div>
<div id="bar" class="card">
  <button id="bs">🛒 المتجر الشامل</button>
  <button id="bc">💬 الدردشة</button>
  <button id="bn">👥 الجيران</button>
  <button id="bh">🏠 بيتي</button>
</div>
<div id="panel" class="card"></div>

<!-- استدعاء مكتبات Three.js و Firebase SDK -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getDatabase, ref, set, get, child } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCVJclfpEp9Jo9879C3RfZKiEdBUibwrxI",
    authDomain: "ahmad-662ee.firebaseapp.com",
    databaseURL: "https://ahmad-662ee-default-rtdb.firebaseio.com",
    projectId: "ahmad-662ee",
    storageBucket: "ahmad-662ee.firebasestorage.app",
    messagingSenderId: "740891153734",
    appId: "1:740891153734:web:1d7c6cd6214a2409618147",
    measurementId: "G-JCJW8S9CVH"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  let me = null, coins = 1000;
  const deviceKey = "village_user_device_lock";
  const hud = document.getElementById('hud'), panel = document.getElementById('panel');

  const R = new THREE.WebGLRenderer({antialias:true});
  R.setSize(innerWidth, innerHeight); document.body.appendChild(R.domElement);
  const S = new THREE.Scene(); S.background = new THREE.Color(0x0f172a);
  const C = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, .1, 500);
  C.position.set(0, 30, 40); C.lookAt(0, 0, 0);
  S.add(new THREE.AmbientLight(0xffffff, 1));

  const plane = new THREE.Mesh(new THREE.PlaneGeometry(300, 300), new THREE.MeshLambertMaterial({color: 0x1e293b}));
  plane.rotation.x = -Math.PI / 2; S.add(plane);

  function updateHUD(){
    hud.innerHTML = `👤 @${me.u} ${me.vip?'<span class="vip-badge">⭐ VIP</span>':''} · 🪙 ${me.coins} نقطة · 🏠 مستوى ${me.l}`;
  }

  document.getElementById('go').onclick = async () => {
    let val = document.getElementById('u').value.trim().replace(/^@/,'').toLowerCase();
    if(!val) { document.getElementById('err').textContent = 'الرجاء إدخال اليوزر'; return; }

    const lockedUser = localStorage.getItem(deviceKey);
    if(lockedUser && lockedUser !== val){
      document.getElementById('err').textContent = `هذا الهاتف مرتبط بالحساب (${lockedUser}) ولا يمكن فتح حساب آخر عليه!`;
      return;
    }

    // جلب بيانات المستخدم من Firebase Realtime Database
    const dbRef = ref(db);
    try {
      const snapshot = await get(child(dbRef, `users/${val}`));
      if (snapshot.exists()) {
        me = snapshot.val();
      } else {
        // إنشاء مستخدم جديد تلقائياً إذا لم يكن موجوداً
        me = {
          u: val,
          l: 1,
          vip: false,
          coins: 500,
          p: [Math.random() * 60 - 30, Math.random() * 60 - 30],
          it: {}
        };
        await set(ref(db, 'users/' + val), me);
      }

      localStorage.setItem(deviceKey, me.u);
      document.getElementById('login').style.display = 'none';
      hud.style.display = 'block';
      document.getElementById('bar').style.display = 'flex';
      updateHUD();
    } catch (error) {
      document.getElementById('err').textContent = 'خطأ في الاتصال بقاعدة البيانات';
      console.error(error);
    }
  };

  function animate(){
    requestAnimationFrame(animate);
    R.render(S, C);
  }
  animate();
</script>
</body>
</html>
