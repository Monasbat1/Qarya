<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مدينة المتابعين الحية - 3D</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body { overflow: hidden; background: #87CEEB; font-family: Tahoma, Arial, sans-serif; }
        #canvas-container { width: 100vw; height: 100vh; }
        
        .overlay-header {
            position: absolute; top: 15px; left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.85); color: #fff;
            padding: 10px 20px; border-radius: 20px;
            text-align: center; border: 2px solid #f1c40f;
            z-index: 10; width: 90%; max-width: 440px;
            backdrop-filter: blur(5px);
        }
        .overlay-header h1 { font-size: 16px; color: #f1c40f; margin-bottom: 3px; }
        .overlay-header p { font-size: 12px; color: #e2e8f0; }

        .action-bar {
            position: absolute; top: 85px; left: 50%;
            transform: translateX(-50%);
            display: flex; gap: 8px; z-index: 10; flex-wrap: wrap; justify-content: center;
        }
        .btn-ui {
            background: #27ae60; color: white; border: none;
            padding: 8px 14px; border-radius: 15px; font-size: 12px;
            font-weight: bold; cursor: pointer; text-decoration: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .btn-roam { background: #2980b9; }
        .btn-car-drive { background: #e67e22; }

        /* أزرار التحكم بالحركة (للتجوال أو قيادة السيارة) */
        .joystick-container {
            position: absolute; bottom: 25px; right: 25px;
            display: none; grid-template-columns: repeat(3, 55px);
            grid-template-rows: repeat(3, 55px); gap: 5px; z-index: 20;
        }
        .joy-btn {
            background: rgba(255, 255, 255, 0.35); border: 2px solid #fff;
            border-radius: 14px; color: #fff; font-size: 20px;
            display: flex; align-items: center; justify-content: center;
            backdrop-filter: blur(4px); cursor: pointer;
        }
        .joy-btn:active { background: rgba(241, 196, 15, 0.8); }
    </style>
</head>
<body>

    <div class="overlay-header">
        <h1>🏙️ مدينة المتابعين التفاعلية</h1>
        <p>تجول في المدينة، ادخل البيوت، وقدّ سيارتك بمنظور خارجي!</p>
    </div>

    <div class="action-bar">
        <a href="store.html" class="btn-ui">🛒 متجر المدينة</a>
        <button class="btn-ui btn-roam" id="toggleRoamBtn">🚶‍♂️ التجوال الحر</button>
        <button class="btn-ui btn-car-drive" id="toggleCarBtn">🚗 قيادة السيارة</button>
    </div>

    <!-- أزرار الحركة اللمسية للشاشة -->
    <div class="joystick-container" id="mobileControls">
        <div></div><div class="joy-btn" id="btnUp">⬆️</div><div></div>
        <div class="joy-btn" id="btnLeft">⬅️</div><div class="joy-btn" id="btnDown">⬇️</div><div class="joy-btn" id="btnRight">➡️</div>
    </div>

    <div id="canvas-container"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyCVJclfpEp9Jo9879C3RfZKiEdBUibwrxI",
          authDomain: "ahmad-662ee.firebaseapp.com",
          databaseURL: "https://ahmad-662ee-default-rtdb.firebaseio.com",
          projectId: "ahmad-662ee",
          storageBucket: "ahmad-662ee.firebasestorage.app",
          messagingSenderId: "740891153734",
          appId: "1:740891153734:web:1d7c6cd6214a2409618147",
          measurementId: "G-JCJW8S9CVH"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        scene.fog = new THREE.Fog(0x87CEEB, 40, 160);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 35, 50);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.maxPolarAngle = Math.PI / 2 - 0.03;

        scene.add(new THREE.AmbientLight(0xffffff, 0.65));
        const sunLight = new THREE.DirectionalLight(0xfff5e4, 0.9);
        sunLight.position.set(50, 80, 40);
        sunLight.castShadow = true;
        scene.add(sunLight);

        // الأرضية
        const ground = new THREE.Mesh(
            new THREE.PlaneGeometry(240, 240),
            new THREE.MeshStandardMaterial({ color: 0x3b8c42, roughness: 0.9 })
        );
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        // الطرق
        function createRoad(w, d, x, z) {
            const road = new THREE.Mesh(
                new THREE.BoxGeometry(w, 0.15, d),
                new THREE.MeshStandardMaterial({ color: 0x2c3e50, roughness: 0.8 })
            );
            road.position.set(x, 0.075, z);
            scene.add(road);
        }
        createRoad(200, 7, 0, 0);
        createRoad(7, 200, 0, 0);
        createRoad(200, 6, 0, 45);
        createRoad(200, 6, 0, -45);
        createRoad(6, 200, 45, 0);
        createRoad(6, 200, -45, 0);

        // بناء العقارات والبيوت والسيارات بدقة
        const housesGroup = new THREE.Group();
        scene.add(housesGroup);

        function buildCar(colorHex) {
            const car = new THREE.Group();
            const chassis = new THREE.Mesh(
                new THREE.BoxGeometry(1.4, 0.5, 2.6),
                new THREE.MeshStandardMaterial({ color: colorHex, metalness: 0.6, roughness: 0.2 })
            );
            chassis.position.y = 0.45;
            chassis.castShadow = true;
            car.add(chassis);

            const cabin = new THREE.Mesh(
                new THREE.BoxGeometry(1.1, 0.45, 1.3),
                new THREE.MeshStandardMaterial({ color: 0x2c3e50 })
            );
            cabin.position.set(0, 0.85, -0.1);
            car.add(cabin);

            const wheelGeo = new THREE.CylinderGeometry(0.25, 0.25, 0.2, 12);
            const wheelMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
            [[-0.7, 0.8], [0.7, 0.8], [-0.7, -0.8], [0.7, -0.8]].forEach(pos => {
                const w = new THREE.Mesh(wheelGeo, wheelMat);
                w.rotation.z = Math.PI / 2;
                w.position.set(pos[0], 0.25, pos[1]);
                car.add(w);
            });
            return car;
        }

        function createBanner(text, borderColor = "#f1c40f") {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = 320; canvas.height = 70;
            ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
            ctx.fillRect(0, 0, 320, 70);
            ctx.strokeStyle = borderColor; ctx.lineWidth = 5;
            ctx.strokeRect(2, 2, 316, 66);
            ctx.fillStyle = '#ffffff'; ctx.font = 'bold 20px Arial';
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText(text, 160, 35);
            const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(canvas) }));
            sprite.scale.set(5.5, 1.2, 1);
            return sprite;
        }

        function addProfessionalProperty(data) {
            const group = new THREE.Group();
            const level = Number(data.levels) || 1;
            const color = Number(data.color) || 0xe67e22;
            const hasCar = data.hasCar === true;

            // قطعة الأرض والإحداثيات التلقائية
            const plot = new THREE.Mesh(
                new THREE.BoxGeometry(9, 0.1, 9),
                new THREE.MeshStandardMaterial({ color: 0x55efc4 })
            );
            plot.position.y = 0.05;
            group.add(plot);

            // بناء البيت وتفاصيل الدخول (غرف وأبواب)
            const houseWidth = level === 3 ? 4.5 : 3.6;
            const houseHeight = level * 2.4;
            const body = new THREE.Mesh(
                new THREE.BoxGeometry(houseWidth, houseHeight, houseWidth),
                new THREE.MeshStandardMaterial({ color: color, roughness: 0.4 })
            );
            body.position.set(-1, houseHeight / 2 + 0.1, -1);
            group.add(body);

            // باب البيت
            const door = new THREE.Mesh(
                new THREE.BoxGeometry(0.9, 1.5, 0.15),
                new THREE.MeshStandardMaterial({ color: 0x5d4037 })
            );
            door.position.set(-1, 0.85, -1 + houseWidth / 2 + 0.05);
            group.add(door);

            // سقف البيت
            const roof = new THREE.Mesh(
                new THREE.ConeGeometry(houseWidth * 0.78, 1.8, 4),
                new THREE.MeshStandardMaterial({ color: 0xc0392b })
            );
            roof.position.set(-1, houseHeight + 1.0, -1);
            roof.rotation.y = Math.PI / 4;
            group.add(roof);

            // السيارة في الكراج
            if (hasCar) {
                const car = buildCar(data.carColor || 0xe74c3c);
                car.position.set(2.5, 0.1, 1.8);
                group.add(car);
            }

            const tag = createBanner(hasCar ? `🚗 ${data.name}` : `🏠 ${data.name}`, level === 3 ? "#f1c40f" : "#2ecc71");
            tag.position.set(-1, houseHeight + 2.8, -1);
            group.add(tag);

            group.position.set(Number(data.x) || 0, 0, Number(data.z) || 0);
            housesGroup.add(group);
        }

        onSnapshot(collection(db, "villagers"), (snapshot) => {
            while(housesGroup.children.length > 0){ housesGroup.remove(housesGroup.children[0]); }
            snapshot.forEach((doc) => { addProfessionalProperty(doc.data()); });
        });

        // 🚗 نظام قيادة السيارة بمنظور خارجي وتجوال حر
        let mode = 'orbit'; // 'orbit', 'roam', 'drive'
        
        const player = new THREE.Group();
        const pBody = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 1.2), new THREE.MeshStandardMaterial({ color: 0x2980b9 }));
        pBody.position.y = 0.8;
        player.add(pBody);
        player.position.set(0, 0, 10);
        player.visible = false;
        scene.add(player);

        const drivableCar = buildCar(0xe74c3c);
        drivableCar.position.set(5, 0.1, 5);
        drivableCar.visible = false;
        scene.add(drivableCar);
        let carAngle = 0;

        const roamBtn = document.getElementById('toggleRoamBtn');
        const carBtn = document.getElementById('toggleCarBtn');
        const mobileControls = document.getElementById('mobileControls');

        roamBtn.addEventListener('click', () => {
            mode = mode === 'roam' ? 'orbit' : 'roam';
            player.visible = (mode === 'roam');
            drivableCar.visible = false;
            mobileControls.style.display = (mode === 'roam') ? 'grid' : 'none';
            roamBtn.innerText = mode === 'roam' ? '🦅 إلغاء التجوال' : '🚶‍♂️ التجوال الحر';
            carBtn.innerText = '🚗 قيادة السيارة';
        });

        carBtn.addEventListener('click', () => {
            mode = mode === 'drive' ? 'orbit' : 'drive';
            drivableCar.visible = (mode === 'drive');
            player.visible = false;
            mobileControls.style.display = (mode === 'drive') ? 'grid' : 'none';
            carBtn.innerText = mode === 'drive' ? '🦅 ترجل من السيارة' : '🚗 قيادة السيارة';
            roamBtn.innerText = '🚶‍♂️ التجوال الحر';
        });

        const moveState = { up: false, down: false, left: false, right: false };
        const bindBtn = (id, dir) => {
            const el = document.getElementById(id);
            el.addEventListener('touchstart', (e) => { e.preventDefault(); moveState[dir] = true; });
            el.addEventListener('touchend', (e) => { e.preventDefault(); moveState[dir] = false; });
            el.addEventListener('mousedown', () => moveState[dir] = true);
            el.addEventListener('mouseup', () => moveState[dir] = false);
        };
        bindBtn('btnUp', 'up'); bindBtn('btnDown', 'down');
        bindBtn('btnLeft', 'left'); bindBtn('btnRight', 'right');

        function animate() {
            requestAnimationFrame(animate);

            if (mode === 'roam') {
                const speed = 0.35;
                if (moveState.up) player.position.z -= speed;
                if (moveState.down) player.position.z += speed;
                if (moveState.left) player.position.x -= speed;
                if (moveState.right) player.position.x += speed;
                camera.position.set(player.position.x, 6, player.position.z + 10);
                controls.target.copy(player.position);
            } else if (mode === 'drive') {
                const speed = 0.45;
                if (moveState.left) carAngle += 0.04;
                if (moveState.right) carAngle -= 0.04;
                drivableCar.rotation.y = carAngle;

                if (moveState.up) {
                    drivableCar.position.x -= Math.sin(carAngle) * speed;
                    drivableCar.position.z -= Math.cos(carAngle) * speed;
                }
                if (moveState.down) {
                    drivableCar.position.x += Math.sin(carAngle) * speed;
                    drivableCar.position.z += Math.cos(carAngle) * speed;
                }
                // منظور الكاميرا الخارجي للسيارة
                camera.position.set(
                    drivableCar.position.x + Math.sin(carAngle) * 12,
                    drivableCar.position.y + 5,
                    drivableCar.position.z + Math.cos(carAngle) * 12
                );
                controls.target.copy(drivableCar.position);
            }

            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
