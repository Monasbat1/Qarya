<head>
<meta charset="utf-8">

<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; font-family: 'Tajawal', system-ui, sans-serif; background: #bfe6f5; overflow: hidden; }
  #scene { display: block; width: 100%; height: 100%; }
  .loading { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.85); color: #fff; display: flex; align-items: center; justify-content: center; z-index: 9999; font-size: 18px; }
  .loading.hidden { display: none; }
  #debug-error-box { position: fixed; bottom: 12px; left: 12px; right: 12px; max-height: 40vh; overflow: auto; background: #fff; color: #991b1b; border: 2px solid #dc2626; border-radius: 10px; padding: 10px; font-family: monospace; font-size: 12px; white-space: pre-wrap; z-index: 10000; display: none; }
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://esm.sh/three@0.169.0",
    "three/addons/": "https://esm.sh/three@0.169.0/examples/jsm/"
  }
}
</script>

<script>
(() => {
  function showErr(title, detail) {
    const box = document.getElementById("debug-error-box");
    if (!box) return;
    box.style.display = "block";
    box.textContent += (box.textContent ? "\n\n---\n\n" : "") + title + "\n" + detail;
  }

  window.addEventListener("error", (e) => {
    showErr("Error: " + (e.message || ""), (e.filename || "") + (e.lineno ? ":" + e.lineno : ""));
  });
  window.addEventListener("unhandledrejection", (e) => {
    const r = e.reason;
    showErr("Promise Error:", r && r.message ? r.message : String(r || ""));
  });

  const sampleNeighborhoods = [
    { id: "n1", name: "حي المعرة", title: "حي المعرة", x: 0, z: 0 },
    { id: "n2", name: "حي داريا", title: "حي داريا", x: 45, z: 12 },
    { id: "n3", name: "حي حنتوتين", title: "حي حنتوتين", x: -45, z: -12 }
  ];

  const sampleHouses = [
    { id: 1, username: "abu_yaqoub", name: "بيت أبو يعقوب", nb: "n1", neighborhood: "n1", level: 10, number: 1, comments: 45, mentions: 9, coins: 15000, x: 0, z: 0 }
  ];
  const nbsIds = ["n1", "n2", "n3"];
  for (let i = 2; i <= 120; i++) {
    const nb = nbsIds[(i - 2) % nbsIds.length];
    const lvl = ((i - 1) % 10) + 1;
    sampleHouses.push({
      id: i,
      username: "user_" + i,
      name: "بيت #" + i,
      nb: nb,
      neighborhood: nb,
      level: lvl,
      number: i,
      comments: lvl * 3,
      mentions: Math.min(9, lvl),
      coins: lvl * 1500
    });
  }

  const samplePlots = sampleHouses.map((h, idx) => {
    const cols = 12;
    const spacing = 14;
    const col = idx % cols;
    const row = Math.floor(idx / cols);
    const px = (col - cols / 2) * spacing;
    const pz = (row - 5) * spacing;
    h.x = px;
    h.z = pz;
    return {
      id: h.id,
      number: h.number,
      nb: h.nb,
      neighborhood: h.nb,
      x: px,
      z: pz,
      w: 8,
      d: 8,
      owner: h.username,
      username: h.username,
      level: h.level
    };
  });

  const mockPayload = {
    ok: true,
    brandName: "قارتنا",
    count: sampleHouses.length,
    totalHouses: sampleHouses.length,
    neighborhoods: sampleNeighborhoods,
    nbs: sampleNeighborhoods,
    towns: sampleNeighborhoods,
    plots: samplePlots,
    houses: sampleHouses,
    leaderboard: sampleHouses,
    top: sampleHouses,
    estates: [],
    notices: [],
    floors: [],
    orders: [],
    army: { ok: true, units: [], forces: [] },
    catalog: { ok: true, items: [] },
    events: []
  };

  const origFetch = window.fetch.bind(window);
  window.fetch = async (input, init) => {
    const rawUrl = typeof input === "string" ? input : (input && input.url) || "";
    const path = rawUrl.split("?")[0];

    if (path.includes("/api/events")) {
      return new Response("retry: 60000\n\n", {
        status: 200,
        headers: { "Content-Type": "text/event-stream" }
      });
    }

    if (path.includes("/api/")) {
      return new Response(JSON.stringify(mockPayload), {
        status: 200,
        headers: { "Content-Type": "application/json" }
      });
    }

    return origFetch(input, init);
  };

  window.addEventListener("DOMContentLoaded", () => {
    setTimeout(() => {
      const l = document.getElementById("loading");
      if (l) l.classList.add("hidden");
    }, 3000);
  });
})();
</script>
</head>

    </div>

  </form>

  <button id="moreBtn" class="fab fab-more" type="button" aria-expanded="false">☰ <span>الم
