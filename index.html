<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>قريتنا التفاعلية - حي المتابعين</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #87CEEB; font-family: Tahoma, Arial, sans-serif; }
        #canvas-container { width: 100vw; height: 100vh; }
        .overlay-header {
            position: absolute; top: 25px; left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.65); color: #fff;
            padding: 10px 22px; border-radius: 25px;
            text-align: center; border: 2px solid #f1c40f;
            z-index: 10; width: 85%; max-width: 380px;
        }
        .overlay-header h1 { font-size: 18px; color: #f1c40f; margin-bottom: 4px; }
        .overlay-header p { font-size: 13px; color: #ecf0f1; }
    </style>
</head>
<body>

    <div class="overlay-header">
        <h1>🏘️ قرية المتابعين الحية</h1>
        <p>فولو + تعليق + تاغ = بناء وترقية بيتك في القرية</p>
    </div>

    <div id="canvas-container"></div>

    <!-- استدعاء مكتبات Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <!-- ربط Firebase SDKs (الإصدار 9 المحدث) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // إعدادات Firebase الخاصة بك
        const firebaseConfig = {
          apiKey: "AIzaSyCVJclfpEp9Jo9879C3RfZKiEdBUibwrxI",
          authDomain: "ahmad-662ee.firebaseapp.com",
          databaseURL: "https://ahmad-662ee-default-rtdb.firebaseio.com",
          projectId: "ahmad-662ee",
          storageBucket: "ahmad-662ee.firebasestorage.app",
          messagingSenderId: "740891153734",
          appId: "1:740891153734:web:1d7c6cd6214a2409618147",
          measurementId: "G-JCJW8S9CVH"
        };

        // تهيئة Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // إعداد مشهد Three.js
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        scene.fog = new THREE.Fog(0x87CEEB, 20, 90);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 18, 25);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.maxPolarAngle = Math.PI / 2 - 0.05;

        scene.add(new THREE.AmbientLight(0xffffff, 0.6));
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(20, 40, 20);
        scene.add(dirLight);

        // أرضية القرية
        const ground = new THREE.Mesh(
            new THREE.PlaneGeometry(100, 100),
            new THREE.MeshStandardMaterial({ color: 0x4caf50 })
        );
        ground.rotation.x = -Math.PI / 2;
        scene.add(ground);

        function createNameTag(name) {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = 256; canvas.height = 64;
            ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
            ctx.fillRect(0, 0, 256, 64);
            ctx.strokeStyle = '#f1c40f'; ctx.lineWidth = 4;
            ctx.strokeRect(0, 0, 256, 64);
            ctx.fillStyle = '#ffffff'; ctx.font = 'bold 22px Arial';
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText(name, 128, 32);

            const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(canvas) }));
            sprite.scale.set(4, 1, 1);
            return sprite;
        }

        function addHouse(x, z, name, color = 0xe67e22, levels = 1) {
            const group = new THREE.Group();
            const height = 2 * levels;
            
            const body = new THREE.Mesh(
                new THREE.BoxGeometry(2.5, height, 2.5),
                new THREE.MeshStandardMaterial({ color: color })
            );
            body.position.y = height / 2;
            group.add(body);

            const roof = new THREE.Mesh(
                new THREE.ConeGeometry(2.1, 1.5, 4),
                new THREE.MeshStandardMaterial({ color: 0xc0392b })
            );
            roof.position.y = height + 0.75;
            roof.rotation.y = Math.PI / 4;
            group.add(roof);

            const tag = createNameTag(name);
            tag.position.y = height + 2.3;
            group.add(tag);

            group.position.set(x, 0, z);
            scene.add(group);
        }

        // جلب البيانات مباشرة من قاعدة بيانات Firebase Firestore
        async function loadVillagers() {
            try {
                const querySnapshot = await getDocs(collection(db, "villagers"));
                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    addHouse(data.x || 0, data.z || 0, data.name || "متابع", Number(data.color) || 0xe67e22, Number(data.levels) || 1);
                });
            } catch (e) {
                console.log("جاري استخدام البيانات المحلية لحين تفعيل قاعدة البيانات:", e);
                // بيانات احتياطية محلية في حال عدم وجود اتصال أو جدول مسجل بعد
                addHouse(0, 0, "أبو يعقوب", 0xf1c40f, 3);
            }
        }

        loadVillagers();

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
