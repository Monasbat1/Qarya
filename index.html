<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>مدينة المتابعين - المجتمع التفاعلي</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;user-select:none}
body{overflow:hidden;background:#87CEEB;font-family:Tahoma,Arial,sans-serif}
#c{width:100vw;height:100vh}
.hdr{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:rgba(15,23,42,.88);color:#fff;padding:8px 18px;border-radius:18px;border:2px solid #f1c40f;z-index:10;width:90%;max-width:440px;text-align:center}
.hdr h1{font-size:15px;color:#f1c40f}.hdr p{font-size:11px;color:#e2e8f0}
.bar{position:absolute;top:74px;left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:10;flex-wrap:wrap;justify-content:center;width:96%}
.b{background:#27ae60;color:#fff;border:0;padding:7px 12px;border-radius:14px;font-size:12px;font-weight:700;cursor:pointer;text-decoration:none;box-shadow:0 3px 6px rgba(0,0,0,.3)}
.b.r{background:#2980b9}.b.d{background:#e67e22}.b.x{background:#c0392b}.b.g{background:#8e44ad}.b.social{background:#d35400}
.joy{position:absolute;bottom:25px;right:25px;display:none;grid-template-columns:repeat(3,55px);grid-template-rows:repeat(3,55px);gap:5px;z-index:20}
.j{background:rgba(255,255,255,.35);border:2px solid #fff;border-radius:14px;color:#fff;font-size:20px;display:flex;align-items:center;justify-content:center}
.j:active{background:rgba(241,196,15,.8)}
.card{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);width:92%;max-width:380px;background:rgba(15,23,42,.96);color:#fff;border:2px solid #f1c40f;border-radius:16px;padding:14px;z-index:30;display:none}
.card h3{color:#f1c40f;font-size:16px;margin-bottom:4px}
.card p{font-size:12px;color:#cbd5e1;margin-bottom:6px}
.pb{height:9px;background:#334155;border-radius:6px;overflow:hidden;margin:6px 0 10px}
.pb i{display:block;height:100%;background:linear-gradient(90deg,#27ae60,#f1c40f)}
.row{display:flex;gap:6px}.row .b{flex:1;padding:10px;text-align:center}
.lb{position:absolute;top:125px;right:10px;width:210px;background:rgba(15,23,42,.92);color:#fff;border-radius:12px;padding:10px;z-index:15;display:none;font-size:12px;border:1px solid #f1c40f}
.lb h4{color:#f1c40f;margin-bottom:6px;font-size:13px}
.lb div{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid #334155}
.toast{position:absolute;top:125px;left:50%;transform:translateX(-50%);background:#f1c40f;color:#0f172a;padding:10px 16px;border-radius:14px;font-weight:700;font-size:13px;z-index:40;display:none;max-width:90%;text-align:center;box-shadow:0 4px 12px rgba(0,0,0,.4)}
/* نافذة الدردشة والتعارف */
.chat-box{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);width:92%;max-width:400px;background:rgba(15,23,42,.97);color:#fff;border:2px solid #2980b9;border-radius:16px;padding:12px;z-index:35;display:none}
.chat-box h3{color:#3498db;font-size:14px;margin-bottom:6px;display:flex;justify-content:space-between}
.chat-msgs{height:120px;background:#0b132b;border-radius:8px;padding:8px;overflow-y:auto;font-size:11px;margin-bottom:8px;display:flex;flex-direction:column;gap:4px}
.chat-msgs div{background:#1e293b;padding:5px 8px;border-radius:6px}
.chat-msgs span{color:#f1c40f;font-weight:bold}
.chat-input{display:flex;gap:6px}
.chat-input input{flex:1;background:#1e293b;border:1px solid #475569;color:#fff;padding:6px 10px;border-radius:8px;font-size:12px}
.chat-input button{background:#2980b9;color:#fff;border:0;padding:6px 12px;border-radius:8px;font-weight:bold;cursor:pointer}
</style>
</head>
<body>
<div class="hdr"><h1>🏙️ مدينة المتابعين</h1><p>انقر على أي بيت لزيارته، محادثة صاحبه، أو الجلوس معه</p></div>
<div class="bar" id="bar">
  <a href="store.html" class="b">🛒 المتجر</a>
  <button class="b r" id="roamBtn">🚶 تجوال</button>
  <button class="b d" id="carBtn">🚗 قيادة</button>
  <button class="b g" id="lbBtn">🏆 الترتيب</button>
  <button class="b social" id="socialBtn">💬 صالون التعارف</button>
  <a href="index.html" class="b x">⬅️ الرئيسية</a>
</div>
<div class="lb" id="lb"></div>
<div class="toast" id="toast"></div>
<div class="card" id="card"></div>
<div class="chat-box" id="chatBox">
  <h3 id="chatTitle"><span>💬 صالون الجلسة والتعارف</span> <span style="cursor:pointer" onclick="document.getElementById('chatBox').style.display='none'">✖</span></h3>
  <div class="chat-msgs" id="chatMsgs"></div>
  <div class="chat-input">
    <input type="text" id="chatInput" placeholder="اكتب رسالة للترحيب بالجار أو الضيف..." />
    <button id="sendChat">إرسال</button>
  </div>
</div>
<button class="b x" id="exitBtn" style="position:absolute;top:74px;left:50%;transform:translateX(-50%);z-index:12;display:none">🚪 الخروج للشارع</button>
<div class="joy" id="joy"><div></div><div class="j" id="bUp">⬆️</div><div></div><div class="j" id="bLeft">⬅️</div><div class="j" id="bDown">⬇️</div><div class="j" id="bRight">➡️</div></div>
<div id="c"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getFirestore, collection, onSnapshot, addDoc, query, orderBy, limit } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
const app = initializeApp({
  apiKey:"AIzaSyCVJclfpEp9Jo9879C3RfZKiEdBUibwrxI",authDomain:"ahmad-662ee.firebaseapp.com",
  databaseURL:"https://ahmad-662ee-default-rtdb.firebaseio.com",projectId:"ahmad-662ee",
  storageBucket:"ahmad-662ee.firebasestorage.app",messagingSenderId:"740891153734",
  appId:"1:740891153734:web:1d7c6cd6214a2409618147",measurementId:"G-JCJW8S9CVH"});
const db = getFirestore(app);
const $ = id => document.getElementById(id);

const MINP = [0,0,50,150,350,700];
const TITLES = ['','خيمة','بيت','فيلا','قصر','برج ذهبي'];
const COLORS = [0,0xe8d5a3,0x3498db,0x9b59b6,0xe67e22,0xf1c40f];
const levelOf = p => p>=700?5:p>=350?4:p>=150?3:p>=50?2:1;
const ptsOf = d => d.points != null ? Number(d.points) : MINP[Math.min(5,Math.max(1,Number(d.levels)||1))];

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87CEEB);
scene.fog = new THREE.Fog(0x87CEEB, 50, 190);
const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, .1, 1000);
camera.position.set(0,45,70);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
$('c').appendChild(renderer.domElement);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.maxPolarAngle = Math.PI/2 - .03;

scene.add(new THREE.HemisphereLight(0xcfe8ff,0x4a7c59,.55));
scene.add(new THREE.AmbientLight(0xffffff,.35));
const sun = new THREE.DirectionalLight(0xfff5e4,.95);
sun.position.set(60,90,50); sun.castShadow = true;
sun.shadow.mapSize.set(2048,2048);
const sc = sun.shadow.camera; sc.left=-110; sc.right=110; sc.top=110; sc.bottom=-110; sc.far=300; sun.shadow.bias=-.0005;
scene.add(sun);

const M = (c,o={}) => new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.6},o));
const Bx = (w,h,d) => new THREE.BoxGeometry(w,h,d);
function mesh(g, geo, mat, x, y, z, ry){
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x,y,z); if(ry) m.rotation.y = ry;
  m.castShadow = true; g.add(m); return m;
}

const ground = new THREE.Mesh(new THREE.PlaneGeometry(280,280), M(0x4a7c59,{roughness:.85}));
ground.rotation.x = -Math.PI/2; ground.receiveShadow = true; scene.add(ground);
[[220,8,0,0],[8,220,0,0]].forEach(r=>{
  const m = new THREE.Mesh(Bx(r[0],.16,r[1]), M(0x1e272e,{roughness:.9}));
  m.position.set(r[2],.08,r[3]); scene.add(m);
});

function banner(text, border){
  const cv = document.createElement('canvas'); cv.width = 360; cv.height = 75;
  const x = cv.getContext('2d');
  x.fillStyle = 'rgba(15,23,42,.88)'; x.fillRect(0,0,360,75);
  x.strokeStyle = border; x.lineWidth = 5; x.strokeRect(2,2,356,71);
  x.fillStyle = '#fff'; x.font = 'bold 20px Arial'; x.textAlign = 'center'; x.textBaseline = 'middle';
  x.fillText(text,180,38);
  const s = new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(cv)}));
  s.scale.set(6.4,1.34,1); return s;
}

function buildCar(c){
  const car = new THREE.Group();
  mesh(car, Bx(1.5,.55,2.8), M(c,{metalness:.7,roughness:.2}), 0,.5,0);
  mesh(car, Bx(1.2,.5,1.4), M(0x111111,{roughness:.1}), 0,.95,-.1);
  const wg = new THREE.CylinderGeometry(.28,.28,.22,16), wm = M(0x222222);
  [[-.78,.9],[.78,.9],[-.78,-.9],[.78,-.9]].forEach(p=>{
    const w = mesh(car, wg, wm, p[0],.28,p[1]); w.rotation.z = Math.PI/2;
  });
  return car;
}

// تصميم شخصية المتابع الفريدة أمام بيته
function createVillagerAvatar(col){
  const av = new THREE.Group();
  mesh(av, new THREE.CylinderGeometry(.22,.45,.8,16), M(col), 0,.6,0);
  const head = mesh(av, new THREE.SphereGeometry(.22,16,16), M(0xfde7e0), 0,1.35,0);
  mesh(av, new THREE.SphereGeometry(.24,16,12,0,Math.PI*2,0,Math.PI*.5), M(0x2c3e50), 0,1.42,0);
  return av;
}

const HEIGHTS = [0,3.4,6,6.8,10,16];
const TXC = {};
const DRAW = {
 grass:[128,128,4,4,(x,w,h)=>{x.fillStyle='#5fa043';x.fillRect(0,0,w,h);for(let i=0;i<900;i++){x.fillStyle=`hsl(${95+Math.random()*25},${45+Math.random()*20}%,${30+Math.random()*20}%)`;x.fillRect(Math.random()*w,Math.random()*h,2,4);}}],
 brick:[128,128,3,2,(x,w,h)=>{x.fillStyle='#cfc6b8';x.fillRect(0,0,w,h);for(let r=0;r<8;r++)for(let c=-1;c<4;c++){x.fillStyle=`hsl(${8+Math.random()*8},${45+Math.random()*10}%,${38+Math.random()*10}%)`;x.fillRect(c*32+(r%2?16:0)+1,r*16+1,30,14);}}],
 stone:[128,128,3,2,(x,w,h)=>{x.fillStyle='#8f897c';x.fillRect(0,0,w,h);for(let r=0;r<4;r++)for(let c=-1;c<3;c++){const v=190+Math.random()*30|0;x.fillStyle=`rgb(${v},${v-6},${v-18})`;x.fillRect(c*64+(r%2?32:0)+2,r*32+2,60,28);}}],
 plaster:[128,128,2,2,(x,w,h)=>{x.fillStyle='#fff';x.fillRect(0,0,w,h);}],
 roof:[128,128,4,2,(x,w,h)=>{x.fillStyle='#4a1212';x.fillRect(0,0,w,h);for(let r=0;r<8;r++)for(let c=-1;c<8;c++){x.fillStyle=`hsl(${5+Math.random()*8},55%,${30+Math.random()*10}%)`;x.beginPath();x.arc(c*16+(r%2?8:0)+8,r*16+4,9,0,Math.PI);x.fill();}}],
 tent:[128,64,2,1,(x,w,h)=>{for(let i=0;i<8;i++){x.fillStyle=i%2?'#f5ecd0':'#c8553d';x.fillRect(i*16,0,16,h);}}],
 tower:[128,256,1,2,(x,w,h)=>{x.fillStyle='#16324f';x.fillRect(0,0,w,h);for(let r=0;r<8;r++)for(let c=0;c<4;c++){x.fillStyle=Math.random()<.35?'#ffe9a8':'#2d5a8a';x.fillRect(c*32+3,r*32+4,26,24);}}],
 plank:[128,128,3,3,(x,w,h)=>{for(let r=0;r<8;r++){x.fillStyle=`hsl(28,${40+Math.random()*10}%,${32+Math.random()*12}%)`;x.fillRect(0,r*16,w,16);}}],
 marble:[128,128,3,3,(x,w,h)=>{for(let r=0;r<2;r++)for(let c=0;c<2;c++){x.fillStyle=(r+c)%2?'#2b2b33':'#efece6';x.fillRect(c*64,r*64,64,64);}}],
 rug:[128,128,1,1,(x,w,h)=>{x.fillStyle='#7b1e2b';x.fillRect(0,0,w,h);x.strokeStyle='#e8c872';x.lineWidth=6;x.strokeRect(10,10,w-20,h-20);}]
};
function tx(n){
  if(TXC[n]) return TXC[n];
  const [w,h,rx,ry,fn] = DRAW[n], c = document.createElement('canvas'); c.width = w; c.height = h;
  fn(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rx,ry);
  return TXC[n] = t;
}
const M2 = (map,o) => new THREE.MeshStandardMaterial(Object.assign({map,roughness:.85},o));
const WOOD = M(0x6d4c41,{roughness:.6}), WHITE = M(0xffffff,{roughness:.5}), GOLD = M(0xf1c40f,{metalness:.9,roughness:.25});
const GLASS = M(0x6fa8dc,{metalness:.9,roughness:.08,emissive:0x2a3b4a});
const bx = (g,w,h,d,mat,x,y,z,ry) => mesh(g,Bx(w,h,d),mat,x,y,z,ry);

function buildHouse(L,col){
  const g = new THREE.Group();
  mesh(g,Bx(10,.12,10),M2(tx('grass'),{roughness:.95}),0,.06,0);
  const plast = new THREE.Color(col).lerp(new THREE.Color(0xffffff),.55);
  if(L===1){
    mesh(g,new THREE.ConeGeometry(2.3,2.8,10,1,true),M2(tx('tent'),{side:THREE.DoubleSide}),0,1.5,0);
  } else if(L===2){
    bx(g,4.4,2.8,4,M2(tx('brick')),0,1.52,0);
    // باب محلي افتراضي
    bx(g,1,2,.14,M(0x5d4037),0,1.15,2.02);
  } else if(L===3){
    bx(g,6,2.8,4.6,M2(tx('plaster'),{color:plast}),0,1.52,0);
    bx(g,4.6,2.5,3.6,M2(tx('plaster'),{color:plast}),0,4.17,-.5);
    bx(g,1.2,2.1,.14,M(0x2d3436),0,1.15,2.32);
  } else if(L===4){
    bx(g,7.6,5,5.4,M2(tx('stone')),0,2.62,0);
    bx(g,2,2.9,.14,M(0x4e342e),0,1.55,2.76);
  } else {
    bx(g,6.4,1.6,6.4,M(0x2f3640),0,.92,0);
    bx(g,4.6,13.2,4.6,M2(tx('tower')),0,8.3,0);
  }
  // إضافة شخصية المتابع أمام البيت
  const av = createVillagerAvatar(col);
  av.position.set(2.5,0,2.5);
  g.add(av);
  return g;
}

// الداخل التفاعلي مع أريكة وطاولة للجلوس والترحيب
const IN = new THREE.Vector3(500,0,500);
const interior = new THREE.Group(); interior.position.copy(IN); scene.add(interior);
const light = new THREE.PointLight(0xfff0d0,1.3,45); light.position.set(0,4.4,0);
interior.add(light);

function buildInterior(L,col,name){
  while(interior.children.length>1) interior.remove(interior.children[1]);
  const wall = M2(tx('plaster'),{color:0xf3e9dc});
  bx(interior,12,.2,12,M2(tx('plank'),{roughness:.7}),0,0,0);
  bx(interior,12,5,.2,wall,0,2.5,-6); bx(interior,.2,5,12,wall,-6,2.5,0); bx(interior,.2,5,12,wall,6,2.5,0);
  
  // أريكة وطاولة للجلوس والتعارف والدردشة مع الضيوف
  const sofa = new THREE.Group(); sofa.position.set(0,0,-1); interior.add(sofa);
  bx(sofa,3.2,.5,1.2,M(0x546e7a),0,.35,0); bx(sofa,3.2,.85,.3,M(0x546e7a),0,.85,-.5);
  
  // طاولة ضيافة وسط الغرفة
  bx(interior,2,.1,1.2,WOOD,0,.5,1.5);
  [[-.9,-.5],[.9,-.5],[-.9,.5],[.9,.5]].forEach(p=>bx(interior,.08,.85,.08,WOOD,p[0],.42,1.5+p[1]));
  
  // لافتة داخلية ترحب بالزوار
  const welcomeBanner = banner(`🏠 صالون استقبال ضيوف ${name}`, '#f1c40f');
  welcomeBanner.position.set(0,4.2,-5.8); interior.add(welcomeBanner);
}

// جلب بيانات المتابعين من Firebase
const vg = new THREE.Group(); scene.add(vg);
let villagers = [], selected = null;
const pickables = [];

onSnapshot(collection(db,"villagers"), snap => {
  while(vg.children.length) vg.remove(vg.children[0]);
  pickables.length = 0; villagers = [];
  snap.forEach(doc => {
    const d = doc.data();
    const L = levelOf(ptsOf(d));
    const col = COLORS[L];
    const g = new THREE.Group();
    g.add(buildHouse(L, col));
    const tag = banner(`${d.name||d.username} (${TITLES[L]})`, L>=4?'#f1c40f':'#2ecc71');
    tag.position.set(0, HEIGHTS[L]+3, 0); g.add(tag);
    g.position.set(Number(d.x)||0, 0, Number(d.z)||0);
    g.userData = {id:doc.id, L, col, name:d.name||d.username, pts:ptsOf(d), x:g.position.x, z:g.position.z};
    vg.add(g); pickables.push(g);
    villagers.push(g.userData);
  });
  renderLB();
});

function renderLB(){
  const top = villagers.slice().sort((a,b)=>b.pts-a.pts).slice(0,8);
  const esc = s => String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  $('lb').innerHTML = '<h4>🏆 أعلى المتابعين</h4>' + (top.map((v,i)=>`<div><span>${i+1}. ${esc(v.name)}</span><b>${v.pts}</b></div>`).join('') || 'لا يوجد سكان');
}
$('lbBtn').onclick = () => { const l=$('lb'); l.style.display = l.style.display==='block'?'none':'block'; };

// نظام بطاقة البيت والزيارة والجلوس
function showCard(u){
  selected = u;
  const L = u.L, nxt = L<5 ? MINP[L+1] : null;
  const pct = nxt ? Math.min(100, Math.round((u.pts-MINP[L])/(nxt-MINP[L])*100)) : 100;
  const c = $('card'); c.style.display = 'block';
  c.innerHTML = `
    <h3>${u.name}</h3>
    <p>${TITLES[L]} • ${u.pts} نقطة</p>
    <div class="pb"><i style="width:${pct}%"></i></div>
    <div class="row">
      <button class="b" onclick="enterHouse()">🚪 زيارة والجلوس</button>
      <button class="b r" onclick="openChat('${u.name}')">💬 دردشة مع الجار</button>
      <button class="b x" style="flex:0 0 40px" onclick="document.getElementById('card').style.display='none'">✖</button>
    </div>
  `;
}

window.enterHouse = () => {
  if(!selected) return;
  buildInterior(selected.L, selected.col, selected.name);
  $('card').style.display = 'none';
  controls.target.set(IN.x, 1.8, IN.z);
  camera.position.set(IN.x, 4.5, IN.z+9);
  $('exitBtn').style.display = 'block';
  $('bar').style.display = 'none';
  toast(`🏠 أهلاً بك في صالون ${selected.name}! يمكنك الجلوس والتعارف.`);
};

window.openChat = (name) => {
  $('chatBox').style.display = 'block';
  $('chatTitle').innerHTML = `<span>💬 محادثة وتعارف مع ${name}</span> <span style="cursor:pointer" onclick="document.getElementById('chatBox').style.display='none'">✖</span>`;
};

// إرسال وقراءة رسائل الدردشة للتعارف بين المتابعين
const chatCol = collection(db, "city_chat");
$('sendChat').onclick = async () => {
  const input = $('chatInput');
  if(!input.value.trim()) return;
  await addDoc(chatCol, {name: selected ? selected.name : "زائر", text: input.value, time: Date.now()});
  input.value = '';
};

onSnapshot(query(chatCol, orderBy("time", "desc"), limit(20)), snap => {
  const box = $('chatMsgs'); box.innerHTML = '';
  snap.forEach(d => {
    const data = d.data();
    box.innerHTML += `<div><span>${data.name}:</span> ${data.text}</div>`;
  });
});

$('socialBtn').onclick = () => { $('chatBox').style.display = $('chatBox').style.display==='block'?'none':'block'; };
$('exitBtn').onclick = () => { $('exitBtn').style.display='none'; $('bar').style.display='flex'; camera.position.set(0,45,70); controls.target.set(0,0,0); };

// التفاعل بالنقر على البيوت في المدينة
renderer.domElement.addEventListener('pointerup', e => {
  const rc = new THREE.Raycaster();
  rc.setFromCamera(new THREE.Vector2(e.clientX/innerWidth*2-1, -(e.clientY/innerHeight)*2+1), camera);
  const hit = rc.intersectObjects(pickables, true)[0];
  if(hit){
    let o = hit.object; while(o && !(o.userData && o.userData.id)) o = o.parent;
    if(o) showCard(o.userData);
  }
});

function toast(t){ const e=$('toast'); e.textContent=t; e.style.display='block'; setTimeout(()=>e.style.display='none',4000); }

function animate(){
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
addEventListener('resize', ()=>{ camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
</script>
</body>
</html>
