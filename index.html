<script>
(() => {
  const MOCK_CONFIG = {
    ok: true,
    towns: {},
    settings: {}
  };

  const MOCK_STATE = {
    ok: true,
    link: "",
    rewards: []
  };

  const MOCK_HOUSES = [
    {
      id: "house-1",
      username: "abu_yaqoub",
      name: "بيت أبو يعقوب",
      country: "sy",
      town: "maarat_al_numan",
      level: 3
    },
    {
      id: "house-2",
      username: "daraya_house",
      name: "بيت داريا",
      country: "sy",
      town: "daraya",
      level: 2
    }
  ];

  const origFetch = window.fetch.bind(window);
  window.fetch = async (input, init) => {
    const url = typeof input === "string" ? input : (input && input.url) || "";
    const clean = url.split("?")[0];

    if (clean.endsWith("/api/config") || clean === "api/config") {
      return new Response(JSON.stringify(MOCK_CONFIG), {
        status: 200,
        headers: { "Content-Type": "application/json" }
      });
    }

    if (clean.endsWith("/api/app/state") || clean === "api/app/state") {
      return new Response(JSON.stringify(MOCK_STATE), {
        status: 200,
        headers: { "Content-Type": "application/json" }
      });
    }

    if (clean.endsWith("/api/houses") || clean === "api/houses") {
      return new Response(JSON.stringify({
        ok: true,
        coins: 150,
        flags: { sy: 2 },
        fv: 1,
        rev: 1,
        hasMore: false,
        houses: MOCK_HOUSES
      }), {
        status: 200,
        headers: { "Content-Type": "application/json" }
      });
    }

    if (clean.includes("/api/")) {
      return new Response(JSON.stringify({ ok: true }), {
        status: 200,
        headers: { "Content-Type": "application/json" }
      });
    }

    return origFetch(input, init);
  };
})();
</script>
