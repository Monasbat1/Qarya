<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>قرية المتابعين الموسعة</title>
<style>
:root{--bg:#0f172a;--fg:#f8fafc;--card:rgba(15,23,42,.9);--ac:#f59e0b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root{--bg:#e2e8f0;--fg:#0f172a;--card:rgba(255,255,255,.94)}}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:system-ui,Tahoma,sans-serif;overflow:hidden;touch-action:none}
canvas{display:block}
.card{position:fixed;background:var(--card);border-radius:14px;padding:10px;font-size:14px;z-index:5}
#login{inset:0;margin:auto;height:fit-content;width:min(86vw,340px);text-align:center}
input,select{padding:9px;border-radius:10px;border:1px solid #64748b;font-size:16px;background:#fff;color:#111}
#login input{width:88%;margin:8px 0;text-align:center;direction:ltr}
button{background:var(--ac);color:#111;border:0;border-radius:10px;padding:8px 12px;font-size:14px;font-weight:700;cursor:pointer}
#err{color:#f87171;min-height:18px}
#hud{top:calc(env(safe-area-inset-top,0px) + 6px);right:8px;display:none}
#near{top:calc(env(safe-area-inset-top,0px) + 6px);left:8px;display:none}
#toast{top:60px;left:50%;transform:translateX(-50%);display:none;white-space:nowrap;z-index:10}
#bar{bottom:calc(env(safe-area-inset-bottom,0px) + 14px);right:8px;display:none;flex-direction:column;gap:6px}
#panel{top:10%;right:5vw;left:5vw;max-height:75vh;overflow:auto;display:none}
.row{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:6px 0;border-bottom:1px solid #64748b55}
#joy{position:fixed;left:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);width:110px;height:110px;border-radius:50%;background:#ffffff22;border:2px solid #ffffff55;display:none;z-index:4}
#knob{position:absolute;left:35px;top:35px;width:40px;height:40px;border-radius:50%;background:#fff9}
</style>
</head>
<body>
<div id="login" class="card">
  <h2>🏘️ قرية المتابعين</h2>
  <div>اكتب يوزرك فقط ليظهر بيتك</div>
  <input id="u" placeholder="username" autocapitalize="off" autocomplete="off">
  <div id="err"></div>
  <button id="go">دخول</button>
  <div style="opacity:.7;margin-top:8px;font-size:12px">تجربة: ahmad ، sara ، omar ، lina ، admin (إدارة)</div>
</div>
<div id="hud" class="card"></div>
<div id="near" class="card"></div>
<div id="toast" class="card"></div>
<div id="bar" class="card">
  <button id="bs">🛒 المتجر</button>
  <button id="bc">💬 الدردشة</button>
  <button id="bn">👥 الجيران</button>
  <button id="bh">🏠 بيتي</button>
  <button id="bd" style="display:none">🚗 قيادة</button>
  <button id="bx" style="display:none">🚪 خروج</button>
  <button id="ba" style="display:none">⚙️ الإدارة</button>
</div>
<div id="panel" class="card"></div>
<div id="joy"><div id="knob"></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const users=[
 {u:'ahmad',c:'SY',l:1,p:[-45,28],h:[0x2b1b12,0x7a4a2a,0x2563eb]},{u:'sara',c:'SA',l:5,p:[0,28],h:[0x111111,0xc1121f,0xffffff]},
 {u:'omar',c:'TR',l:3,p:[45,28],h:[0x3a2a1a,0x3a2a1a,0x16a34a]},{u:'lina',c:'DE',l:10,p:[-45,-28],h:[0xd9b45b,0xd9b45b,0xdb2777]},
 {u:'yusuf',c:'EG',l:2,p:[0,-28],h:[0x111111,0x111111,0xf59e0b]},{u:'mona',c:'SY',l:8,p:[45,-28],h:[0x111111,0x6d28d9,0xe5e7eb]},{u:'admin',c:'SY',l:30,p:[45,70],h:[0x111111,0xd4af37,0xffffff],admin:1}];
const flags={SY:['#007a3d','#fff','#111'],SA:['#006c35','#006c35','#006c35'],TR:['#e30a17','#e30a17','#e30a17'],DE:['#111','#dd0000','#ffce00'],EG:['#ce1126','#fff','#111']};
let INSIDE=false;

// 30 مستوى مع أسعار تصاعدية دقيقة
const costs={}; for(let i=2;i<=30;i++) costs[i]=i*150;

const SHOP={
 dsn:[['m','عصري (خشب وزجاج)',0],['c','كلاسيكي بسقف أحمر',300],['r','قصر حجري فاخر',600]],
 car:[['sedan','🚗 سيارة عائلية',200],['sport','🏎️ سيارة رياضية',500],['limo','🚐 ليموزين فاخرة',1000],['truck','🛻 بيك أب',350]],
 tw:[['t1','🗼 برج مراقبة',400],['t2','🏰 برج قلعة ملكية',800],['space','🚀 صاروخ استكشافي',1500]],
 park:[['p1','⛲ حديقة بنافورة',300],['p2','🎠 منتزه ألعاب ترفيهي',700],['pool','🏊 مسبح خارجي',1200]],
 floor:[['f1','أرضية حجرية',150],['f2','أرضية خشبية فاخرة',250],['f3','أرضية رخام ملكي',500]],
 furn:[['u1','🪑 طقم جلسة خارجية',200],['u2','🛋️ بيرغولا وأريكة',450],['u3','🎪 أرجوحة ومظلة',350],['statue','🗿 تمثال ذهبي',2000]]};

const CAT={dsn:'🏠 تصميم البيت',car:'🚗 السيارات',tw:'🗼 الأبراج',park:'🌳 المنتزهات والحدائق',floor:'🧱 الأرضيات',furn:'🪑 الأثاث والديكور'};
const own=new Set();
users.forEach((u,i)=>{u.s=['m','c','r','m','c','r'][i];u.it={car:['sedan','sport',null,'truck',null,'sedan'][i],tw:[null,null,null,'t1',null,'t2'][i],park:[null,'p1',null,'p2','p1',null][i],floor:[null,'f1','f2','f3',null,'f1'][i],furn:['u1',null,'u2',null,'u3','u1'][i]}});
Object.assign(users[6],{s:'c',it:{car:'limo',tw:'space',park:'pool',floor:'f3',furn:'statue'}});
let me=null,coins=5000,HM={},ST=[],COLS=[];

const R=new THREE.WebGLRenderer({antialias:true});
R.setSize(innerWidth,innerHeight);R.setPixelRatio(Math.min(devicePixelRatio,2));
document.body.appendChild(R.domElement);
const S=new THREE.Scene();S.background=new THREE.Color(0x8ec9f0);S.fog=new THREE.Fog(0x8ec9f0,150,500);
const C=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.1,800);
const HL=new THREE.HemisphereLight(0xffffff,0x557755,.95);S.add(HL);
const sun=new THREE.DirectionalLight(0xffffff,.8);sun.position.set(80,100,40);S.add(sun);
const M=c=>new THREE.MeshLambertMaterial({color:c});
function box(w,h,d,c,x,y,z,p){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),M(c));m.position.set(x,y,z);(p||S).add(m);return m}
function cyl(r1,r2,h,c,x,y,z,p,s){const m=new THREE.Mesh(new THREE.CylinderGeometry(r1,r2,h,s||16),M(c));m.position.set(x,y,z);(p||S).add(m);return m}
function label(t){const k=document.createElement('canvas');k.width=256;k.height=64;const g=k.getContext('2d');
 g.fillStyle='#000a';g.fillRect(0,0,256,64);g.fillStyle='#fff';g.font='bold 28px sans-serif';g.textAlign='center';g.fillText(t,128,42);
 return new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(k)}))}
function tag(t,x,y,z,sx,sy,p){const s=label(t);s.position.set(x,y,z);s.scale.set(sx,sy,1);(p||S).add(s)}
const sc=(x,z,hx,hz)=>ST.push([x-hx,x+hx,z-hz,z+hz]);

const hgt=(x,z)=>{const d=Math.max(Math.abs(x),Math.abs(z)*1.1),f=Math.min(Math.max((d-180)/80,0),1),q=f*f*(3-2*f);return q*(25+15*Math.sin(x*.03+1)*Math.cos(z*.03)+8*Math.sin(x*.08+z*.07))};
const TR={rn:[]};{const g=TR.g=new THREE.PlaneGeometry(700,700,140,140);g.rotateX(-Math.PI/2);const p=g.attributes.position,cl=[],c1=new THREE.Color(0x5aa14f),c2=new THREE.Color(0x3b7a3a),c3=new THREE.Color(0x8d8a80),t=new THREE.Color();
 for(let i=0;i<p.count;i++){const x=p.getX(i),z=p.getZ(i),h=hgt(x,z);p.setY(i,h);t.copy(c1).lerp(c2,Math.min(h/15,1)).lerp(c3,Math.max((h-25)/15,0));cl.push(t.r,t.g,t.b)}
 g.setAttribute('color',new THREE.Float32BufferAttribute(cl,3));g.computeVertexNormals();S.add(new THREE.Mesh(g,new THREE.MeshLambertMaterial({vertexColors:true})))}

// شوارع رئيسية وفرعية واسعة
box(350,.1,12,0x8a7a62,0,0,0);box(12,.1,350,0x8a7a62,0,0,0);
box(350,.1,8,0x8a7a62,0,0,50);box(350,.1,8,0x8a7a62,0,0,-50);
box(8,.1,350,0x8a7a62,50,0,0);box(8,.1,350,0x8a7a62,-50,0,0);

const STN=(()=>{const k=document.createElement('canvas');k.width=k.height=128;const g=k.getContext('2d');g.fillStyle='#6f6a60';g.fillRect(0,0,128,128);
 for(let r=0;r<8;r++){let x=-(r%2)*10;while(x<128){const w=18+Math.random()*16,v=Math.floor((Math.random()-.5)*50);g.fillStyle='rgb('+(150+v)+','+(144+v)+','+(132+v)+')';g.fillRect(x+1.5,r*16+1.5,w-3,13);x+=w}}
 const t=new THREE.CanvasTexture(k);t.wrapS=t.wrapT=THREE.RepeatWrapping;return t})();
function sMat(rx,ry){const t=STN.clone();t.needsUpdate=true;t.repeat.set(rx,ry);return new THREE.MeshLambertMaterial({map:t})}
function boxS(w,h,d,x,y,z,p){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),sMat(Math.max(w,d)/3,h/2.5));m.position.set(x,y,z);(p||S).add(m);return m}
function cylS(r1,r2,h,x,y,z,p){const m=new THREE.Mesh(new THREE.CylinderGeometry(r1,r2,h,14),sMat(4,h/2.5));m.position.set(x,y,z);(p||S).add(m);return m}
function roof(w,len,hh,c,x,y,z,p){const r=w/1.732,m=cyl(r,r,len,c,x,y+hh/3,z,p,3);m.rotation.x=-Math.PI/2;m.scale.z=hh/(1.5*r);return m}

function classic(g,l,L){const w=6.5+l*.5,d=6+l*.3,z=-2.5,fz=z+d/2,up=l>5?3.5:0;
 boxS(w+.3,1.3,d+.3,0,.85,z,g);box(w,3.2+up,d,0xf3efe6,0,3.1+up/2,z,g);
 roof(w+1.4,d+1.2,3.2+l*.3,0xb8483f,0,4.7+up,z,g);
 box(1,2.1,.15,0x6b3f22,0,2.55,fz+.08,g);[-1,1].forEach(s=>box(1.1,1.4,.15,0x9fd3ff,s*w/3,2.9,fz+.08,g));
 L.push([-w/2-.3,w/2+.3,z-d/2-.2,fz+2.4])}
function rustic(g,l,L){const w=6+l*.6,d=6,z=-2.5,h=3.6+(l>5?3:0),fz=z+d/2;
 boxS(w,h,d,0,h/2+.2,z,g);roof(w+1,d+1,2.8,0x3d4046,0,h+.2,z,g);
 box(1.3,2.3,.2,0x5a3a22,w/2-1.5,1.35,fz+.08,g);box(1.4,1.4,.2,0x9fd3ff,-w/4,2.4,fz+.08,g);
 L.push([-w/2,w/2,z-d/2,fz+.4])}

function carG(k,g,x,z){
 const col=k==='sport'?0xdc2626:k==='limo'?0x111111:k==='truck'?0x2b6cb0:0xf5f5f5,lo=k==='sport'?.55:k==='limo'?.7:.75,len=k==='limo'?5.5:4;
 box(1.9,.7,len,col,x,lo,z,g);box(1.7,.65,len*.5,col,x,lo+.65,z-.1,g);
 [[-1,-1.3],[1,-1.3],[-1,1.3],[1,1.3]].forEach(a=>{cyl(.4,.4,.3,0x111111,x+a[0]*.95,.4,z+a[1],g,12).rotation.z=Math.PI/2});return g}
function ball(r,c,x,y,z,p){const m=new THREE.Mesh(new THREE.SphereGeometry(r,10,8),new THREE.MeshBasicMaterial({color:c}));m.position.set(x,y,z);p.add(m);return m}

function decor(g,lv){
 const GD=0xd4af37,fl=[0xef4444,0xf59e0b,0xec4899,0xa855f7];
 if(lv>=5)for(let k=0;k<6;k++)box(.6,.5,.6,fl[k%4],k<3?-2.6:2.6,.5,3+(k%3)*1.6,g);
 if(lv>=10)[-2.4,2.4].forEach(x=>{boxS(.8,2.2,.8,x,1.3,8,g);ball(.3,0xffe9a0,x,2.7,8,g)});
 if(lv>=15)[-7.35,7.35].forEach(x=>box(.5,.8,14,0x2f7d32,x,.7,0,g));
 if(lv>=20){cyl(.1,.1,12,GD,0,6,-2,g,6);ball(.5,GD,0,12.5,-2,g)}
 if(lv>=30){cyl(0,1.2,2,GD,0,16,-2,g,8);ball(1.4,0xfff1b0,0,15,-2,g).material.transparent=true;ball(1.6,0xffaa00,0,15,-2,g).material.transparent=true;ball(1.6,0xffaa00,0,15,-2,g).material.opacity=.3}
}

function items(g,u,L){const it=u.it||{};
 if(it.floor){const f=it.floor,m=new THREE.Mesh(new THREE.BoxGeometry(16,.04,16),f==='f1'?sMat(5,5):M(f==='f2'?0xa5733d:0xe8e6e1));m.position.set(0,.22,0);g.add(m)}
 if(it.car&&!u.dr){carG(it.car,g,6,2.6);L.push([5,7,.5,4.7])}
 if(it.tw){const x=-6.6,z=-6.6,tp=it.tw;
  if(tp==='space'){cylS(1.2,1.8,12,x,6,z,g);cyl(0,1.5,4,0xdc2626,x,14,z,g,12)}
  else{const b=tp==='t2';cylS(1.5,1.7,b?10:8,x,b?5.2:4.2,z,g);cyl(1.9,1.9,.5,0x7a7d80,x,b?10.3:8.3,z,g,12)}
  L.push([x-1.8,x+1.8,z-1.8,z+1.8])}
 if(it.park){const x=-5.6,z=3.2,pk=it.park;
  if(pk==='pool'){box(4,.2,3,0x38bdf8,x,.2,z,g);box(4.4,.2,3.4,0xd4af37,x,.1,z,g)}
  else if(pk==='p1'){cylS(1.4,1.4,.6,x,.5,z,g);cyl(1.1,1.1,.1,0x5ec8ff,x,.82,z,g,16)}
  else{[-1.4,1.4].forEach(a=>box(.2,2.6,.2,0x2563eb,x+a,1.5,z,g));box(3,.2,.2,0x2563eb,x,2.8,z,g)}
  L.push([x-1.6,x+1.6,z-1.6,z+1.6])}
 if(it.furn){const x=6,z=-1,fn=it.furn;
  if(fn==='statue'){cylS(.8,1,.4,x,.2,z,g);cyl(.4,.4,2.5,0xd4af37,x,1.5,z,g);ball(.7,0xd4af37,x,3,z,g)}
  else if(fn==='u1'){box(1.4,.1,1.4,0x8b5a2b,x,.85,z,g);cyl(.1,.1,.85,0x555555,x,.42,z,g,8)}
  else{box(2,.5,.8,0x7c3aed,x,.45,z,g)}
  L.push([x-1.4,x+1.4,z-1.4,z+1.4])}
}

function build(u){
 if(HM[u.u])S.remove(HM[u.u]);
 const g=new THREE.Group(),lv=u.l,l=lv<=10?1:lv<=20?2:3,L=[],rot=u.p[1]>0;
 box(16,.2,16,0x5f9f4d,0,.1,0,g);box(3.6,.06,12,0xd9d3c4,0,.23,2,g);
 if(u.s==='c')classic(g,l,L);else if(u.s==='r')rustic(g,l,L);else{boxS(6,3,5,0,1.5,-2,g);roof(7,6,3,0x4b4e57,0,4,-2,g);L.push([-3,3,-4.5,.5]);}
 tag('@'+u.u,0,l===1?9:13,-2,5,1.25,g);items(g,u,L);decor(g,lv);
 g.position.set(u.p[0],0,u.p[1]);g.rotation.y=rot?Math.PI:0;S.add(g);HM[u.u]=g;
 u.cols=L.map(r=>rot?[u.p[0]-r[1],u.p[0]-r[0],u.p[1]-r[3],u.p[1]-r[2]]:[u.p[0]+r[0],u.p[0]+r[1],u.p[1]+r[2],u.p[1]+r[3]]);
 if(!INSIDE)COLS=ST.concat(...users.map(x=>x.cols||[]));

 cyl(.28,.75,1.5,dr,0,1.45,0,g,16);

 [[l1,-.2],[l2,.2]].forEach(a=>{a[0].position.set(a[1],.95,0);cyl(.1,.09,.9,0x9b2d3a,0,-.45,0,a[0],8);box(.28,.16,.4,0x111111,0,-.92,.06,a[0]);g.add(a[0])});
 [-1,1].forEach(s=>{box(.14,.8,.14,0xfbeee8,s*.45,1.8,0,g);const e=cyl(0,.18,.5,0xfbeee8,s*.6,2.95,0,g,6);e.rotation.z=-s*1.3;box(.3,.5,.3,hb,s*.62,2.4,-.1,g)});
 const hd=new THREE.Mesh(new THREE.SphereGeometry(.55,20,16),M(0xfbeee8));hd.position.y=2.95;g.add(hd);
 const hr=new THREE.Mesh(new THREE.SphereGeometry(.6,20,12,0,6.2832,0,1.25),M(ht));hr.position.y=2.97;g.add(hr);
 box(.95,.2,.12,ht,0,3.3,.52,g);box(1,1.5,.3,hb,0,2.35,-.45,g);

const P=avatar(0x111111,0xc1121f,0xffffff);S.add(P);

users.forEach(build);
users.forEach(u=>{const a=avatar(u.h[0],u.h[1],u.h[2]),r=u.p[1]>0,x=r?u.p[0]+3.5:u.p[0]-3.5,z=r?u.p[1]-6:u.p[1]+6;a.position.set(x,0,z);a.rotation.y=r?Math.PI:0;S.add(a);sc(x,z,.6,.6)});
COLS=ST.concat(...users.map(x=>x.cols));

// معالم القرية الكبرى والسوق والأعلام
cyl(0,14,16,0xd9b36b,-90,8,-100,S,4);tag('🏛️ المعلم الرئيسي',-90,18,-100,8,2);sc(-90,-100,10,10);
cyl(2,2.8,32,0xcfc7b8,90,16,-100,S,6);tag('🗼 برج المتابعين الكشميري',90,34,-100,9,2);sc(90,-100,4,4);

for(let i=0;i<7;i++){const x=-54+i*18;box(8,1,5,0x8b5a2b,x,.5,-140);cyl(0,6,3,0xe11d48,x,4.5,-140,S,4);sc(x,-140,4,2)}
tag('🛒 السوق المركزي الضخم',0,10,-140,12,3);

function flagTex(cs){const k=document.createElement('canvas');k.width=96;k.height=64;const g=k.getContext('2d');cs.forEach((c,i)=>{g.fillStyle=c;g.fillRect(0,i*21.4,96,22)});return new THREE.CanvasTexture(k)}
const cnt={};users.forEach(u=>cnt[u.c]=(cnt[u.c]||0)+1);
Object.keys(cnt).forEach((c,i,a)=>{const x=-40+i*80/Math.max(a.length-1,1),h=10+cnt[c]*4;
 cyl(.18,.18,h,0xdddddd,x,h/2,-12);
 const f=new THREE.Mesh(new THREE.PlaneGeometry(5,3.3),new THREE.MeshBasicMaterial({map:flagTex(flags[c]),side:2}));f.position.set(x+2.5,h-1.6,-12);S.add(f);
 tag(c+' ×'+cnt[c],x,h+2.5,-12,3.5,.9)});
COLS=ST.concat(...users.map(x=>x.cols));

// غابة ضخمة تحيط بالمدينة
TR.N=500;{const N=500,D=new THREE.Object3D(),Z=new THREE.Matrix4().makeScale(0,0,0),col=new THREE.Color(),pal=[0x2f7d32,0x3a8f3e,0x1f6b34,0xe0a82e,0xd9783f],
 tr=new THREE.InstancedMesh(new THREE.CylinderGeometry(.35,.5,2.4,6),M(0x6b4423),N),cn=new THREE.InstancedMesh(new THREE.ConeGeometry(2.1,5.5,8),M(0xffffff),N),bl=new THREE.InstancedMesh(new THREE.SphereGeometry(2.3,8,6),M(0xffffff),N);
 for(let i=0;i<N;i++){let x=(Math.random()-.5)*600,z=(Math.random()-.5)*600;

}

// التحكم والحركة
const keys={};addEventListener('keydown',e=>keys[e.key.toLowerCase()]=1);addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);

const hit=(x,z,r)=>{r=r||.6;return COLS.some(c=>(c[4]===undefined||c[4]===CF)&&x>c[0]-r&&x<c[1]+r&&z>c[2]-r&&z<c[3]+r)};

  if(DR){const th=-z,st=x,tv=th>=0?th*25:th*10;DR.v+=(tv-DR.v)*Math.min(1,dt*2.2);DR.a-=st*dt*1.8*Math.sign(DR.v)*Math.min(Math.abs(DR.v)/6,1);
   const nx=Math.max(-145,Math.min(145,DR.x+Math.sin(DR.a)*DR.v*dt)),nz=Math.max(-145,Math.min(145,DR.z+Math.cos(DR.a)*DR.v*dt));
   if(!hit(nx,DR.z,1.2))DR.x=nx;if(!hit(DR.x,nz,1.2))DR.z=nz;
   DR.g.position.set(DR.x,0,DR.z);DR.g.rotation.y=DR.a;P.position.set(DR.x,0,DR.z);
  }else{const cs=Math.cos(yaw),sn=Math.sin(yaw);{const a=x*cs+z*sn,b=-x*sn+z*cs;x=a;z=b}
   const l=Math.hypot(x,z);let mv=0;
   if(l>.05){const n=Math.min(l,1)/l,px=P.position.x,pz=P.position.z,nx=Math.max(BD[0],Math.min(BD[1],px+x*n*10*dt)),nz=Math.max(BD[2],Math.min(BD[3],pz+z*n*10*dt)),ok=(a,b)=>!hit(a,b)&&(!INSIDE||gyIn(a,b,P.position.y)!==null);

   const s=mv?Math.sin(T*10)*.6:0;P.userData.l1.rotation.x=s;P.userData.l2.rotation.x=-s;
   if(INSIDE){const y=gyIn(P.position.x,P.position.z,P.position.y);if(y!==null)P.position.y+=(y-P.position.y)*Math.min(1,dt*14);CF=Math.round(P.position.y/5);FG.forEach((q,i)=>q.visible=i<=Math.floor(P.position.y/5+.05));IL.position.set(IX,CF*5+3.6,0);if(CF===0&&P.position.z>5.2&&Math.abs(P.position.x-IX)<1.5)exitHome()}
   else near()}
  const ty=DR?1.5:P.position.y+2.5,cp=Math.cos(pit);C.position.set(P.position.x+Math.sin(yaw)*cp*dst,ty+Math.sin(pit)*dst,P.position.z+Math.cos(yaw)*cp*dst);C.lookAt(P.position.x,ty,P.position.z);

 else{const t=T*.1;C.position.set(Math.sin(t)*110,48,Math.cos(t)*110);C.lookAt(0,3,0)}

// الواجهة والدردشة والجيران وتحصيل النقاط
const $=id=>document.getElementById(id),hud=$('hud'),panel=$('panel');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pub=[{u:'sara',t:'أهلاً بالجميع في القرية الموسعة 👋'},{u:'omar',t:'منزل جديد ومستويات رائعة'}],pm={};
let tab='pub',tgt=null,nr=null;

function near(){let b=null,bd=16;users.forEach(u=>{const d=Math.hypot(P.position.x-u.p[0],P.position.z-u.p[1]);if(d<bd){bd=d;b=u}});
 if(b!==nr){nr=b;const n=$('near');if(!b){n.style.display='none';return}n.style.display='block';
  n.innerHTML=(b===me?'🏠 بيتك ':'🏠 جار: @'+b.u+' <button id="nc">💬</button> ')+'<button id="nd">🚪 دخول</button>';
  $('nd').onclick=()=>goIn(b);const c=$('nc');if(c)c.onclick=()=>openChat(b.u)}}

function nbr(){panel.innerHTML='<b>👥 الجيران والقرية</b>'+users.filter(x=>x!==me).map(x=>'<div class="row"><span>@'+x.u+' · '+x.c+' · مستوى '+x.l+'</span><span><button data-v="'+x.u+'">زيارة</button> <button data-c="'+x.u+'">💬</button></span></div>').join('');

 me=f;$('ba').style.display=me.admin?'block':'none';[me.s,...Object.values(me.it)].forEach(v=>v&&own.add(v));$('login').style.display='none';hud.style.display='block';$('bar').style.display='flex';J.style.display='block';upd();tp(me)};

function shop(){const n=me.l+1;let h='<b>🛒 المتجر الشامل</b><div class="row"><span>'+(n>30?'بيتك في أعلى مستوى 👑':'ترقية البيت إلى مستوى '+n+' — 🪙 '+costs[n])+'</span>'+(n>30?'':'<button id="up">ترقية</button>')+'</div>';
 Object.keys(SHOP).forEach(k=>{h+='<div style="margin-top:8px"><b>'+CAT[k]+'</b></div>';SHOP[k].forEach(a=>{const on=(k==='dsn'?me.s:me.it[k])===a[0],ow=own.has(a[0])||a[2]===0||on;h+='<div class="row"><span>'+a[1]+(ow?'':' — 🪙 '+a[2])+'</span><button data-k="'+k+'" data-i="'+a[0]+'">'+(on?'✓ مُفعّل':ow?'تفعيل':'شراء')+'</button></div>'})});
 panel.innerHTML=h;const b=$('up');if(b)b.onclick=()=>{if(coins<costs[n]){toast('رصيدك لا يكفي 🪙');return}coins-=costs[n];me.l=n;build(me);upd();shop()};
 panel.querySelectorAll('[data-k]').forEach(x=>x.onclick=()=>{const k=x.dataset.k,i=x.dataset.i,a=SHOP[k].find(q=>q[0]===i);

  if(k==='dsn')me.s=i;else me.it[k]=(me.it[k]===i?null:i);build(me);upd();const t=panel.scrollTop;shop();panel.scrollTop=t})}
$('bs').onclick=()=>show('s',shop);
$('bd').onclick=()=>DR?stopDrive():startDrive();$('bx').onclick=exitHome;$('ba').onclick=()=>show('a',adm);
